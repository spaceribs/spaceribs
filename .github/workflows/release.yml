name: Release

on:
  - workflow_dispatch

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # nx release pushes the version commits and tags, and creates the
      # GitHub releases.
      contents: write
      # Mints the OIDC token npm exchanges for publish rights, and signs the
      # provenance attestation. Publishing fails without it.
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v3
        with:
          # nx release resolves each package's current version from its release
          # tag, so the full history and all tags have to be present.
          fetch-depth: 0
          ref: main
          # Push over SSH as the release deploy key. A ruleset protects main
          # and github-actions[bot] cannot be granted a bypass, so a push
          # carrying the default GITHUB_TOKEN is rejected with GH013. Deploy
          # keys can be bypass actors, and this key is in that list. Setting it
          # here makes checkout point origin at the SSH remote and persist a
          # core.sshCommand using this key, so the push nx release makes later
          # in the job authenticates as the deploy key rather than the bot.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Setup toolchain
        uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true

      - name: Setup Git
        run: |
          git config user.name "GitHub Bot"
          git config user.email "gituser@example.com"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Versions from conventional commits, writes the changelogs, then commits,
      # tags, pushes and opens the GitHub releases. Publishing is a separate
      # step so it keeps going through `npm publish` rather than `pnpm publish`,
      # which nx release would use and which does not carry npm's OIDC flow.
      - name: Version and changelog
        shell: bash
        run: pnpm exec nx release --skip-publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # No npm token: each package authenticates through the trusted publisher
      # configured for it on npmjs.com, which must name this repository and
      # this workflow file. Packages whose version is already on the registry
      # are skipped by the executor's checkExisting option.
      - name: Publish
        shell: bash
        run: |
          # ngx-deploy-npm spawns a bare `npm`, and that does not resolve to
          # the npm 11 pinned in .prototools: under `pnpm exec` the running
          # node's own bin directory wins, giving the npm bundled with node.
          # npm 10 has no OIDC support at all, so publishing failed with
          # ENEEDAUTH and no diagnostics. Put proto's shims first so the
          # pinned npm wins in the child too.
          export PATH="$HOME/.proto/shims:$HOME/.proto/bin:$PATH"

          # Gate on the npm the publish will really use, resolved exactly the
          # way nx resolves it. The previous check ran in a plain step, where
          # `npm` resolves differently, so it passed while the publish used a
          # version that cannot authenticate.
          required=11.5.1
          resolved="$(pnpm exec bash -c 'command -v npm')"
          current="$(pnpm exec bash -c 'npm --version')"
          echo "publish will use $resolved ($current)"
          if [ "$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)" != "$required" ]; then
            echo "::error::npm >= $required is required for trusted publishing, but nx will spawn $resolved ($current)"
            exit 1
          fi

          pnpm exec nx run-many --target=npm --parallel=1
        env:
          NPM_CONFIG_PROVENANCE: true
          # npm swallows a failed OIDC exchange and falls back to ordinary
          # auth, so a mismatched trusted publisher surfaces only as ENEEDAUTH
          # with no reason given. npm logs the registry's own explanation at
          # verbose ("Failed token exchange request with body message: ..."),
          # so keep this step verbose: an auth failure here is otherwise
          # undiagnosable from the run log.
          NPM_CONFIG_LOGLEVEL: verbose
